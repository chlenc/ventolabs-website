<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Team AI adoption curve over 60 days">
  <rect width="800" height="500" fill="#eeeae0"/>
  <g fill="#1e3c14" opacity="0.08">
    <circle cx="40" cy="40" r="1.5"/><circle cx="120" cy="40" r="1.5"/><circle cx="200" cy="40" r="1.5"/><circle cx="280" cy="40" r="1.5"/><circle cx="360" cy="40" r="1.5"/><circle cx="440" cy="40" r="1.5"/><circle cx="520" cy="40" r="1.5"/><circle cx="600" cy="40" r="1.5"/><circle cx="680" cy="40" r="1.5"/><circle cx="760" cy="40" r="1.5"/>
  </g>
  <!-- axes -->
  <g stroke="#1e3c14" stroke-width="1.2">
    <line x1="100" y1="80" x2="100" y2="380"/>
    <line x1="100" y1="380" x2="720" y2="380"/>
  </g>
  <!-- gridlines -->
  <g stroke="#1e3c14" stroke-width="0.6" opacity="0.15">
    <line x1="100" y1="160" x2="720" y2="160"/>
    <line x1="100" y1="240" x2="720" y2="240"/>
    <line x1="100" y1="320" x2="720" y2="320"/>
  </g>
  <!-- adoption curve -->
  <path d="M 100 370 C 260 368 300 330 380 260 C 450 200 520 140 700 110" fill="none" stroke="#1e3c14" stroke-width="2.5"/>
  <circle cx="380" cy="260" r="6" fill="#eeeae0" stroke="#1e3c14" stroke-width="2"/>
  <circle cx="700" cy="110" r="6" fill="#1e3c14"/>
  <!-- labels -->
  <g font-family="Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#1e3c14">
    <text x="100" y="405">DAY 0</text>
    <text x="360" y="405">DAY 30</text>
    <text x="660" y="405">DAY 60</text>
    <text x="380" y="235" text-anchor="middle">WORKSHOPS</text>
    <text x="700" y="90" text-anchor="end">DAILY USE</text>
  </g>
  <text x="120" y="120" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" fill="#1e3c14">from &#8220;toy&#8221; to tool</text>
  <text x="48" y="470" font-family="Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#1e3c14" opacity="0.55">VL / TRAINING · MEASURED ADOPTION</text>
  <text x="752" y="470" font-family="Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#1e3c14" opacity="0.55" text-anchor="end">03</text>
</svg>
