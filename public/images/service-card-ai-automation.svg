<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Automated workflow from lead to invoice">
  <rect width="800" height="500" fill="#eeeae0"/>
  <g fill="#1e3c14" opacity="0.08">
    <circle cx="40" cy="40" r="1.5"/><circle cx="120" cy="40" r="1.5"/><circle cx="200" cy="40" r="1.5"/><circle cx="280" cy="40" r="1.5"/><circle cx="360" cy="40" r="1.5"/><circle cx="440" cy="40" r="1.5"/><circle cx="520" cy="40" r="1.5"/><circle cx="600" cy="40" r="1.5"/><circle cx="680" cy="40" r="1.5"/><circle cx="760" cy="40" r="1.5"/>
    <circle cx="40" cy="460" r="1.5"/><circle cx="120" cy="460" r="1.5"/><circle cx="200" cy="460" r="1.5"/><circle cx="280" cy="460" r="1.5"/><circle cx="360" cy="460" r="1.5"/><circle cx="440" cy="460" r="1.5"/><circle cx="520" cy="460" r="1.5"/><circle cx="600" cy="460" r="1.5"/><circle cx="680" cy="460" r="1.5"/><circle cx="760" cy="460" r="1.5"/>
  </g>
  <!-- pipeline -->
  <g font-family="Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5">
    <rect x="60" y="130" width="130" height="52" rx="8" fill="none" stroke="#1e3c14" stroke-width="1.2"/>
    <text x="125" y="161" text-anchor="middle" fill="#1e3c14">LEAD</text>
    <line x1="190" y1="156" x2="250" y2="156" stroke="#1e3c14" stroke-width="1.2"/>
    <path d="M 244 151 L 252 156 L 244 161 Z" fill="#1e3c14"/>
    <rect x="255" y="130" width="150" height="52" rx="8" fill="#1e3c14"/>
    <text x="330" y="161" text-anchor="middle" fill="#f3ead8">QUALIFY · AI</text>
    <line x1="405" y1="156" x2="465" y2="156" stroke="#1e3c14" stroke-width="1.2"/>
    <path d="M 459 151 L 467 156 L 459 161 Z" fill="#1e3c14"/>
    <rect x="470" y="130" width="120" height="52" rx="8" fill="none" stroke="#1e3c14" stroke-width="1.2"/>
    <text x="530" y="161" text-anchor="middle" fill="#1e3c14">CRM</text>
    <line x1="590" y1="156" x2="650" y2="156" stroke="#1e3c14" stroke-width="1.2"/>
    <path d="M 644 151 L 652 156 L 644 161 Z" fill="#1e3c14"/>
    <rect x="655" y="130" width="110" height="52" rx="8" fill="none" stroke="#1e3c14" stroke-width="1.2"/>
    <text x="710" y="161" text-anchor="middle" fill="#1e3c14">REPLY</text>
    <!-- branch down from QUALIFY -->
    <path d="M 330 182 L 330 250 L 180 250 L 180 300" fill="none" stroke="#1e3c14" stroke-width="1.2" stroke-dasharray="3 5"/>
    <path d="M 330 182 L 330 250 L 520 250 L 520 300" fill="none" stroke="#1e3c14" stroke-width="1.2" stroke-dasharray="3 5"/>
    <rect x="105" y="300" width="150" height="52" rx="8" fill="none" stroke="#1e3c14" stroke-width="1.2"/>
    <text x="180" y="331" text-anchor="middle" fill="#1e3c14">SHEETS</text>
    <rect x="445" y="300" width="150" height="52" rx="8" fill="none" stroke="#1e3c14" stroke-width="1.2"/>
    <text x="520" y="331" text-anchor="middle" fill="#1e3c14">REPORT</text>
  </g>
  <text x="400" y="415" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" fill="#1e3c14" text-anchor="middle">zero manual work</text>
  <text x="48" y="470" font-family="Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#1e3c14" opacity="0.55">VL / AUTOMATION · n8n + MAKE</text>
  <text x="752" y="470" font-family="Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#1e3c14" opacity="0.55" text-anchor="end">02</text>
