name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_ACTIONS: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
          # PostHog token + host come from .env.production (committed).
          # Override here with secrets/vars if a different project is needed.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      # The sitemap the deploy is about to publish — IndexNow reads it from
      # here after the deploy succeeds.
      - uses: actions/upload-artifact@v4
        with:
          name: sitemap
          path: out/sitemap.xml
          retention-days: 1

  deploy:
    permissions:
      pages: write
      id-token: write
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell Yandex and Bing what changed. Google ignores IndexNow — its side is
  # covered by the sitemap in Search Console.
  #
  # `continue-on-error` is deliberate: the site is already live at this point,
  # and a refused ping only costs us crawl latency, never correctness.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: sitemap
          path: out
      - run: node scripts/indexnow.mjs
        env:
          # Public by design: the protocol verifies ownership by fetching this
          # same value from the site root, so it cannot be a secret.
          INDEXNOW_KEY: 9009a2da1f71b19368d4887af472f6e4
