name: Notification security checks

on:
  push:
    paths:
      - "cloudflare/notify-worker/**"
      - "supabase/functions/notify/**"
      - "tests/notify-security.test.mjs"
      - ".github/workflows/notify-security.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "cloudflare/notify-worker/**"
      - "supabase/functions/notify/**"
      - "tests/notify-security.test.mjs"
      - ".github/workflows/notify-security.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  notify-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test tests/notify-security.test.mjs
